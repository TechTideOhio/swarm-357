[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techtide-swarm"
version = "0.2.2"
description = "Python multi-agent orchestration framework: a 357-role Claude agent catalog across six business layers, with portable memory, enforced cost caps, and human-in-the-loop approvals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
authors = [{ name = "TechTide AI", email = "ai@techtide.ai" }]
keywords = [
  "agents",
  "ai",
  "ai-agents",
  "agent-framework",
  "agent-memory",
  "agent-orchestration",
  "agentic-ai",
  "anthropic",
  "autonomous-agents",
  "claude",
  "cost-control",
  "fastapi",
  "human-in-the-loop",
  "llm",
  "llmops",
  "multi-agent",
  "orchestration",
  "swarm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.5",
  "pyyaml>=6",
  "httpx>=0.28.1",
  "rich>=13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "build>=1.0",
  "twine>=5.0",
]
web = [
  "exa-py>=1.0",
  "firecrawl-py>=0.0.20",
]
supabase = [
  "supabase>=2.0",
]

[project.urls]
Homepage = "https://swarm357.techtideai.io"
Documentation = "https://swarm357.techtideai.io/docs"
Repository = "https://github.com/TechTideOhio/swarm-357"
Changelog = "https://swarm357.techtideai.io/changelog"
Issues = "https://github.com/TechTideOhio/swarm-357/issues"
Blog = "https://swarm357.techtideai.io/blog"

[project.scripts]
swarm = "techtide_swarm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/techtide_swarm"]

[tool.hatch.build.targets.sdist]
include = [
  "src/techtide_swarm",
  "README.md",
  "pyproject.toml",
  "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Explicit default rule set: keep CI stable across ruff minor releases (0.16+).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["techtide_swarm"]

# CLI is large and UI-heavy; keep strict typing on library code.
[[tool.mypy.overrides]]
module = "techtide_swarm.cli"
ignore_errors = true

# Optional external integrations that ship no type stubs. These are only
# imported when the corresponding extras ([web], [supabase]) are installed,
# so allow missing imports for them without weakening type checking elsewhere.
[[tool.mypy.overrides]]
module = ["supabase", "exa_py", "firecrawl", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true
