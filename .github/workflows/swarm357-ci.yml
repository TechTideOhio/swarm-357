name: swarm357-ci

on:
  push:
    paths:
      - "Apps/swarm357/**"
      - ".github/workflows/swarm357-ci.yml"
  pull_request:
    paths:
      - "Apps/swarm357/**"
      - ".github/workflows/swarm357-ci.yml"

defaults:
  run:
    working-directory: Apps/swarm357

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install techtide-swarm
        run: pip install -e "packages/techtide-swarm[dev]"
      - name: Ruff lint
        run: ruff check packages/techtide-swarm/src
      - name: MyPy type check
        run: cd packages/techtide-swarm && mypy src
      - name: Pytest
        run: python -m pytest packages/techtide-swarm/tests -v

  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate 357-agent roster
        run: python scripts/generate_roster.py --fix-counts

  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Apps/swarm357/.ui_landin_sample/minimal/package-lock.json
      - name: Install and build landing
        working-directory: Apps/swarm357/.ui_landin_sample/minimal
        run: |
          npm ci
          npm run build
          npm run typecheck

  rust-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: Cargo build memvid-swarm-bridge
        working-directory: Apps/swarm357/packages/memvid-swarm-bridge
        run: cargo build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install techtide-swarm (for bridge tests)
        run: pip install -e "packages/techtide-swarm[dev]"
      - name: Run bridge integration tests
        env:
          MEMVID_SWARM_BRIDGE: ${{ github.workspace }}/Apps/swarm357/packages/memvid-swarm-bridge/target/debug/memvid-swarm-bridge
        run: python -m pytest packages/techtide-swarm/tests/test_bridge_integration.py -v
