name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    env:
      # Prefer API token when configured; empty means use OIDC trusted publishing.
      # Trusted publisher must match: TechTideOhio/swarm-357, workflow publish.yml, env pypi.
      PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build wheel + sdist
        working-directory: packages/techtide-swarm
        run: python -m build

      - name: Publish to PyPI (API token)
        if: env.PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/techtide-swarm/dist/
          password: ${{ env.PYPI_TOKEN }}

      - name: Publish to PyPI (trusted publishing)
        if: env.PYPI_TOKEN == ''
        id: pypi_oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/techtide-swarm/dist/

      - name: Fail if PyPI publish did not succeed
        if: env.PYPI_TOKEN == '' && steps.pypi_oidc.outcome != 'success'
        run: |
          echo "::error::PyPI trusted publishing failed. Configure the publisher at"
          echo "https://pypi.org/manage/project/techtide-swarm/settings/publishing/"
          echo "for repo TechTideOhio/swarm-357, workflow publish.yml, environment pypi,"
          echo "or add repository secret PYPI_API_TOKEN."
          exit 1

      - name: Extract changelog section
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = text.splitlines()
          out = []
          capturing = False
          for line in lines:
              if line.startswith("## [") and capturing:
                  break
              if line.startswith("## [0.") or (line.startswith("## [") and "Unreleased" not in line):
                  if not capturing:
                      capturing = True
                      out.append(line)
                      continue
              if capturing:
                  out.append(line)
          body = "\n".join(out).strip() or "See CHANGELOG.md"
          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(body[:500])
          PY

      # Cut the GitHub Release even when PyPI fails so tags are not silent.
      - name: GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            packages/techtide-swarm/dist/*
          generate_release_notes: true
