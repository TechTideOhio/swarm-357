# Standalone CI — use this when swarm357 is its own repo (TechTideOhio/swarm-357).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install techtide-swarm
        run: pip install -e "packages/techtide-swarm[dev]"
      - name: Ruff lint
        working-directory: packages/techtide-swarm
        run: ruff check src
      - name: MyPy type check
        working-directory: packages/techtide-swarm
        run: mypy src
      - name: Pytest
        working-directory: packages/techtide-swarm
        run: python -m pytest tests -v -p no:schemathesis

  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate 357-agent roster
        run: python scripts/generate_roster.py --fix-counts

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build wheel + sdist
        working-directory: packages/techtide-swarm
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/techtide-swarm/dist/

  rust-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"
      - name: Cargo build memvid-swarm-bridge
        working-directory: packages/memvid-swarm-bridge
        run: cargo build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install techtide-swarm (for bridge tests)
        run: pip install -e "packages/techtide-swarm[dev]"
      - name: Run bridge integration tests
        env:
          MEMVID_SWARM_BRIDGE: ${{ github.workspace }}/packages/memvid-swarm-bridge/target/debug/memvid-swarm-bridge
        run: python -m pytest packages/techtide-swarm/tests/test_bridge_integration.py -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t swarm357-api:ci .
      - name: Health check agents == 357
        run: |
          set -euo pipefail
          docker run -d --name swarm357-api -p 8000:8000 swarm357-api:ci
          cleanup() { docker rm -f swarm357-api >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8000/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "API health endpoint did not become ready"
            docker logs swarm357-api || true
            exit 1
          fi
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/health.json", encoding="utf-8"))
          agents = data.get("agents")
          print(data)
          if agents != 357:
              sys.exit(f"expected agents==357, got {agents!r}")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .ui_landin_sample/minimal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .ui_landin_sample/minimal/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
