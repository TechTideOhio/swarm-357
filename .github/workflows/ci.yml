# file: .github/workflows/ci.yml
# description: Standalone CI for TechTideOhio/swarm-357 (Python, roster, Docker, Rust)
# reference: packages/techtide-swarm, packages/memvid-swarm-bridge, Dockerfile
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install techtide-swarm
        run: pip install -e "packages/techtide-swarm[dev]"
      - name: Ruff lint
        working-directory: packages/techtide-swarm
        run: ruff check src
      - name: MyPy type check
        working-directory: packages/techtide-swarm
        run: mypy src
      - name: Pytest with coverage
        working-directory: packages/techtide-swarm
        run: >
          python -m pytest tests -v -p no:schemathesis
          --cov=techtide_swarm --cov-report=term-missing
          --cov-fail-under=40
      - name: Clean-wheel boot smoke (3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build packages/techtide-swarm
          python -m venv /tmp/swarm-wheel-venv
          /tmp/swarm-wheel-venv/bin/pip install packages/techtide-swarm/dist/*.whl
          /tmp/swarm-wheel-venv/bin/swarm boot | tee /tmp/boot.txt
          grep -E "357|agents" /tmp/boot.txt

  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate 357-agent roster
        run: python scripts/generate_roster.py --fix-counts
      - name: Verify Support souls packaged
        run: |
          set -euo pipefail
          test -d packages/techtide-swarm/src/techtide_swarm/data/soul/support
          count=$(find packages/techtide-swarm/src/techtide_swarm/data/soul/support -name '*.md' | wc -l)
          test "$count" -ge 5

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build wheel + sdist
        working-directory: packages/techtide-swarm
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: packages/techtide-swarm/dist/

  rust-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cargo fmt
        working-directory: packages/memvid-swarm-bridge
        run: cargo fmt --check
      - name: Cargo clippy
        working-directory: packages/memvid-swarm-bridge
        run: cargo clippy -- -D warnings
      - name: Cargo build memvid-swarm-bridge
        working-directory: packages/memvid-swarm-bridge
        run: cargo build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install techtide-swarm (for bridge tests)
        run: pip install -e "packages/techtide-swarm[dev]"
      - name: Run bridge integration tests
        env:
          MEMVID_SWARM_BRIDGE: ${{ github.workspace }}/packages/memvid-swarm-bridge/target/debug/memvid-swarm-bridge
        run: python -m pytest packages/techtide-swarm/tests/test_bridge_integration.py -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        run: docker build -t swarm357-api:ci .
      - name: Health + auth + non-200 failure checks
        run: |
          set -euo pipefail
          docker run -d --name swarm357-api -p 8000:8000 \
            -e SWARM_API_KEY=ci-test-key \
            -e SWARM_REQUIRE_AUTH=1 \
            swarm357-api:ci
          cleanup() { docker rm -f swarm357-api >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8000/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "API health endpoint did not become ready"
            docker logs swarm357-api || true
            exit 1
          fi
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/health.json", encoding="utf-8"))
          agents = data.get("agents")
          print(data)
          if agents != 357:
              sys.exit(f"expected agents==357, got {agents!r}")
          PY
          # Unauthenticated execute must not be 200
          code=$(curl -s -o /tmp/unauth.json -w "%{http_code}" \
            -X POST http://127.0.0.1:8000/api/swarm/run \
            -H "Content-Type: application/json" \
            -d '{"task":"ping","layer":"sales","simulate":true}')
          echo "unauth status=$code body=$(cat /tmp/unauth.json)"
          test "$code" != "200"

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Ban scrubbed path references in public docs
        run: |
          set -euo pipefail
          if rg -n --glob '!**/CHANGELOG*' --glob '!**/HISTORY*' \
            -e '\.planning/' -e '\.repos and items/' -e '\.ui_landin_sample/' \
            README.md STATUS.md CONTRIBUTING.md RELEASE.md CLAUDE.md SECURITY.md \
            docs/ packages/*/README.md *.md \
            2>/dev/null; then
            echo "Banned-path references found in public docs"
            exit 1
          fi
          echo "No banned-path references in public docs"
      - name: Eval baseline separation gate
        run: python scripts/check_eval_baseline.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package + pip-audit
        run: |
          pip install -e "packages/techtide-swarm[dev]"
          pip install pip-audit
      - name: Audit Python deps
        run: pip-audit
