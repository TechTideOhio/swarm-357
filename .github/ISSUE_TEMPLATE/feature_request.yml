name: Feature request
description: Propose a capability or a change to an existing one.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like the runtime to do instead.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, other tools, or why the existing primitives do not cover this.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is about the orchestration runtime, not adding more agent roles to the catalog.
