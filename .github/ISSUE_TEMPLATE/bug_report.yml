name: Bug report
description: Something in the runtime, CLI, or HTTP API does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check the [maturity matrix](https://github.com/TechTideOhio/swarm-357/blob/main/STATUS.md).
        Several subsystems are marked experimental on purpose, and behaviour there is expected to move.

        Never paste API keys, `.env` contents, or full request headers into an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The smallest command or snippet that shows the problem.
      render: bash
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `pip show techtide-swarm | grep Version`.
      placeholder: "0.2.2"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - Python API
        - HTTP API / SSE
        - Memvid bridge
        - Evals
        - Docs
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Tracebacks or log lines, with secrets removed.
      render: text
